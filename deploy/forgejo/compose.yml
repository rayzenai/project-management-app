# Forgejo at git.sdoc.gov.np: the Dokploy Compose project "git", built from
# this repository (compose path ./deploy/forgejo/compose.yml). Runbook:
# docs/forgejo.md. Every setting is a FORGEJO__section__KEY variable, so
# app.ini on the data volume is never edited by hand; the values come from
# the project's Environment tab (see .env.example next to this file).
#
# The domain is added in Dokploy (service forgejo, port 3000, HTTPS), which
# attaches this service to Traefik's dokploy-network. The web port is never
# published; only the built-in SSH server is, on 2222.

services:
  forgejo:
    # 15.0 LTS, supported to 15 July 2027. Pin the exact point release and
    # bump it by hand (docs/forgejo.md, Upgrades).
    image: codeberg.org/forgejo/forgejo:15.0.11
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      FORGEJO__server__DOMAIN: ${FORGEJO_DOMAIN:?set FORGEJO_DOMAIN}
      FORGEJO__server__ROOT_URL: https://${FORGEJO_DOMAIN}/
      FORGEJO__server__HTTP_PORT: "3000"
      FORGEJO__server__SSH_DOMAIN: ${FORGEJO_DOMAIN}
      FORGEJO__server__START_SSH_SERVER: "true"
      FORGEJO__server__SSH_PORT: "2222"
      FORGEJO__server__SSH_LISTEN_PORT: "2222"

      FORGEJO__database__DB_TYPE: postgres
      FORGEJO__database__HOST: forgejo-db:5432
      FORGEJO__database__NAME: forgejo
      FORGEJO__database__USER: forgejo
      FORGEJO__database__PASSWD: ${FORGEJO_DB_PASSWORD:?set FORGEJO_DB_PASSWORD}

      # No web installer, ever. An empty SECRET_KEY would fall back to a
      # well-known constant, so it is required.
      FORGEJO__security__INSTALL_LOCK: "true"
      FORGEJO__security__SECRET_KEY: ${FORGEJO_SECRET_KEY:?set FORGEJO_SECRET_KEY}
      # The 15.x image defaults this to "*"; trust only Traefik's network.
      FORGEJO__security__REVERSE_PROXY_TRUSTED_PROXIES: ${FORGEJO_TRUSTED_PROXIES:?set FORGEJO_TRUSTED_PROXIES}

      # Sign-in only through the tracker (OIDC source "sdoc-tasks"): no
      # password form, no password over HTTP basic auth (access tokens and
      # SSH keys still work), no sign-up form, no OpenID 2.0, nothing visible
      # to anonymous visitors.
      FORGEJO__service__REQUIRE_SIGNIN_VIEW: "true"
      FORGEJO__service__ALLOW_ONLY_EXTERNAL_REGISTRATION: "true"
      FORGEJO__service__ENABLE_INTERNAL_SIGNIN: "false"
      FORGEJO__service__ENABLE_BASIC_AUTHENTICATION: "false"
      FORGEJO__openid__ENABLE_OPENID_SIGNIN: "false"
      FORGEJO__openid__ENABLE_OPENID_SIGNUP: "false"
      # Forgejo 16+ only (15 ignores it); the default there is false too.
      FORGEJO__service__ADD_MEMBERS_BY_INVITATIONS: "false"

      # The tracker's organization is the tenant boundary: forge
      # organizations are made by a site admin for a tracker organization,
      # never by users, and are private.
      FORGEJO__service__DEFAULT_ORG_VISIBILITY: private
      FORGEJO__service__DEFAULT_ALLOW_CREATE_ORGANIZATION: "false"
      FORGEJO__admin__DISABLE_REGULAR_ORG_CREATION: "true"

      FORGEJO__repository__DEFAULT_PRIVATE: private

      # First sign-in creates the account. "nickname" takes the id_token's
      # preferred_username (the tracker's users.git_username) on 15 and 17.
      FORGEJO__oauth2_client__ENABLE_AUTO_REGISTRATION: "true"
      FORGEJO__oauth2_client__USERNAME: nickname
      FORGEJO__oauth2_client__ACCOUNT_LINKING: login

      FORGEJO__webhook__ALLOWED_HOST_LIST: ${FORGEJO_WEBHOOK_ALLOWED_HOSTS:?set FORGEJO_WEBHOOK_ALLOWED_HOSTS}
      FORGEJO__migrations__ALLOW_LOCALNETWORKS: "false"

      FORGEJO__mailer__ENABLED: ${FORGEJO_MAILER_ENABLED:-true}
      FORGEJO__mailer__PROTOCOL: smtps
      FORGEJO__mailer__SMTP_ADDR: ${FORGEJO_SMTP_ADDR:?set FORGEJO_SMTP_ADDR}
      FORGEJO__mailer__SMTP_PORT: ${FORGEJO_SMTP_PORT:-465}
      FORGEJO__mailer__USER: ${FORGEJO_SMTP_USER:?set FORGEJO_SMTP_USER}
      FORGEJO__mailer__PASSWD: ${FORGEJO_SMTP_PASSWORD:?set FORGEJO_SMTP_PASSWORD}
      FORGEJO__mailer__FROM: ${FORGEJO_MAIL_FROM:?set FORGEJO_MAIL_FROM}
    volumes:
      - forgejo-data:/data
    ports:
      - "${FORGEJO_SSH_PUBLISH_PORT:-2222}:2222"
    healthcheck:
      # The image ships curl.
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost:3000/api/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    networks:
      - default

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: forgejo
      POSTGRES_USER: forgejo
      POSTGRES_PASSWORD: ${FORGEJO_DB_PASSWORD:?set FORGEJO_DB_PASSWORD}
    volumes:
      - forgejo-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U forgejo -d forgejo"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      default:
        # Forgejo also sits on the shared dokploy-network, where another
        # project's service could be called "db"; this name is ours alone.
        aliases:
          - forgejo-db

volumes:
  forgejo-data:
  forgejo-db:
