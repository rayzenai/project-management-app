<html lang="en">
<head>

<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#2f62d8;text-decoration:none}a:hover{color:#244fb3}
.i{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round;flex:none}
.a-av{display:inline-grid;place-items:center;flex:none;width:22px;height:22px;border-radius:999px;background:#e8ecf4;color:#2a3344;font-size:10px;font-weight:600}
.a-chip{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 10px;border:1px solid #e1e4ea;border-radius:999px;background:#ffffff;color:#2b313d;font-family:inherit;font-size:13px;font-weight:500;cursor:pointer}
.a-chip:hover{background:#f4f5f8}
.a-tok{padding:1px 4px;margin:0 -1px;border-radius:5px;background:#e7edfc;color:#2f62d8}
.a-opt{display:flex;align-items:center;gap:10px;width:100%;height:40px;padding:0 10px;border:0;border-radius:8px;background:transparent;color:#14171f;font-family:inherit;font-size:14px;text-align:left;cursor:pointer}
.a-opt:hover{background:#f4f5f8}
.a-row{display:flex;align-items:center;gap:12px;min-height:44px}
.a-check{flex:none;width:18px;height:18px;padding:0;border:1.5px solid #b4bac6;border-radius:999px;background:#ffffff}
</style>
</helmet>
<div style="position: relative; width: 960px; height: 600px; box-sizing: border-box; padding: 44px 64px; overflow: hidden; background: #ffffff; color: #14171f; font-family: Geist, ui-sans-serif, system-ui, sans-serif;">

<h1 style="margin: 0; font-size: 28px; line-height: 34px; font-weight: 600; letter-spacing: -0.02em;">My work</h1>
<p style="margin: 6px 0 0; font-size: 14px; color: #636a78;">Monday, 2 November</p>

<div style="position: relative; margin-top: 22px; border: 1.5px solid #2f62d8; border-radius: 12px; background: #ffffff; box-shadow: 0 0 0 4px rgba(47, 98, 216, 0.12);">
<div style="display: flex; align-items: center; gap: 12px; height: 50px; padding: 0 14px;">
<svg class="i" viewBox="0 0 24 24" aria-hidden="true" style="color: #2f62d8;"><path d="M5 12h14"></path><path d="M12 5v14"></path></svg>
<div role="textbox" aria-label="Add a task" style="flex: 1; min-width: 0; font-size: 15px; white-space: nowrap;">Paalika mapping review <span class="a-tok">Friday</span> with <span class="a-tok">Su</span><span style="display: inline-block; width: 1.5px; height: 18px; margin-left: 1px; vertical-align: -3px; background: #14171f;"></span></div>
</div>
<div style="display: flex; align-items: center; gap: 8px; flex-wrap: wrap; padding: 0 14px 12px 42px;">
<button type="button" class="a-chip"><svg class="i" viewBox="0 0 24 24" aria-hidden="true" style="width: 14px; height: 14px; color: #636a78;"><rect width="18" height="18" x="3" y="4" rx="2"></rect><path d="M16 2v4"></path><path d="M8 2v4"></path><path d="M3 10h18"></path></svg>Fri 6 Nov</button>
<button type="button" class="a-chip"><svg class="i" viewBox="0 0 24 24" aria-hidden="true" style="width: 14px; height: 14px; color: #636a78;"><path d="M20 20a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9L9.6 3.9A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2Z"></path></svg>Local land services / Lalpurja<svg class="i" viewBox="0 0 24 24" aria-hidden="true" style="width: 14px; height: 14px; color: #8a909c;"><path d="m6 9 6 6 6-6"></path></svg></button>
<button type="button" class="a-chip" style="border-style: dashed; color: #636a78;"><svg class="i" viewBox="0 0 24 24" aria-hidden="true" style="width: 14px; height: 14px;"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><line x1="19" x2="19" y1="8" y2="14"></line><line x1="22" x2="16" y1="11" y2="11"></line></svg>Who</button>
<span style="flex: 1;"></span>
<span style="display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; color: #636a78;"><span style="padding: 1px 6px; border: 1px solid #dfe2e8; border-radius: 5px; font-size: 11.5px;">Enter</span>to add</span>
</div>

<div role="listbox" aria-label="People" style="position: absolute; top: 46px; left: 268px; width: 300px; padding: 6px; border: 1px solid #e1e4ea; border-radius: 12px; background: #ffffff; box-shadow: 0 1px 2px rgba(20, 23, 31, 0.06), 0 12px 32px rgba(20, 23, 31, 0.14);">
<button type="button" role="option" aria-selected="true" class="a-opt" style="background: #f1f4fb;"><span class="a-av">SL</span><span style="flex: 1; min-width: 0;"><span style="display: block; font-weight: 500;">Sujan Lama</span></span><span style="font-size: 12.5px; color: #636a78;">Computer Engineer</span></button>
<button type="button" role="option" aria-selected="false" class="a-opt"><span class="a-av">SR</span><span style="flex: 1; min-width: 0;"><span style="display: block; font-weight: 500;">Sushila Rai</span></span><span style="font-size: 12.5px; color: #636a78;">Section Officer</span></button>
<button type="button" role="option" aria-selected="false" class="a-opt"><span class="a-av">SK</span><span style="flex: 1; min-width: 0;"><span style="display: block; font-weight: 500;">Suresh Karki</span></span><span style="font-size: 12.5px; color: #636a78;">Under Secretary</span></button>
</div>
</div>

<div style="margin-top: 28px; opacity: 0.45;">
<div style="display: flex; align-items: baseline; gap: 8px; margin-bottom: 4px;"><h2 style="margin: 0; font-size: 15px; font-weight: 600;">Today</h2><span style="font-size: 13px; color: #636a78;">2</span></div>
<div class="a-row"><span class="a-check"></span><span style="font-size: 15px;">Kageshwori visit</span><span style="font-size: 13px; color: #636a78;">Local land services / Digitalization</span></div>
<div class="a-row"><span class="a-check"></span><span style="font-size: 15px;">English and Nepali paalika names</span><span style="font-size: 13px; color: #636a78;">Local land services / Dashboard</span></div>
<div style="display: flex; align-items: baseline; gap: 8px; margin: 18px 0 4px;"><h2 style="margin: 0; font-size: 15px; font-weight: 600;">Tomorrow</h2><span style="font-size: 13px; color: #636a78;">2</span></div>
<div class="a-row"><span class="a-check"></span><span style="font-size: 15px;">Letter from SDOC</span><span style="font-size: 13px; color: #636a78;">Local land services / PMO interface</span></div>
</div>
</div>
</x-dc>
