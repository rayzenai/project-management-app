# SDOC Docs' home page (onlyoffice/home/site), in place of the editor's own
# "location = /", a redirect to its status page at /welcome/, which the
# Dockerfile takes out. Copied to /etc/nginx/includes, where ds.conf includes
# every ds-*.conf inside its server block. The headers of "location = /" are
# the image's own (its cache reset included), plus a policy for this page.

location = / {
  root /var/www/sdoc-home;
  try_files /index.html =404;
  default_type text/html;
  add_header Strict-Transport-Security $hsts_header always;
  add_header X-Content-Type-Options nosniff always;
  add_header Set-Cookie "ds_cache_reset=1; Path=/; Max-Age=31536000; SameSite=Lax" always;
  add_header Clear-Site-Data $clear_site_data always;
  add_header Content-Security-Policy "default-src 'none'; style-src 'self'; img-src 'self'; font-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
  add_header Cache-Control "no-cache" always;
}

location ^~ /sdoc-home/ {
  alias /var/www/sdoc-home/;
  types {
    text/css css;
    image/svg+xml svg;
    font/woff2 woff2;
  }
  add_header X-Content-Type-Options nosniff always;
  add_header Cache-Control "no-cache" always;
}

# The status page's old address comes here.
location = /welcome {
  return 302 $the_scheme://$the_host$the_prefix/;
}

location ^~ /welcome/ {
  return 302 $the_scheme://$the_host$the_prefix/;
}
